[project]
name = "cite2link"
dynamic = ["version"]
description = "Convert scripture citations like \"John 3:15\" into hyperlinks (HTML, Markdown, canonical URLs, and normalized references)."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Daniel Hardman", email = "daniel.hardman@gmail.com" }]
keywords = ["scripture", "citation", "hyperlink", "markdown", "reference", "bible"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Religion",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Markup",
    "Topic :: Religion",
]
# The core library and CLI have zero runtime dependencies.
dependencies = []

[project.optional-dependencies]
# The General Conference talk finder (cite2link.gc) is unfinished and opt-in.
# It scrapes a search engine and so pulls in `requests`; the rest of cite2link
# stays dependency-free. See the tick tracking this work.
gc = ["requests>=2"]

[project.urls]
Homepage = "https://github.com/dhh1128/cite2link"
Repository = "https://github.com/dhh1128/cite2link"
Issues = "https://github.com/dhh1128/cite2link/issues"

[project.scripts]
cite2link = "cite2link.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Single source of truth for the version: hatch reads __version__ out of the
# package's __init__.py, so the version lives in exactly one place.
[tool.hatch.version]
path = "src/cite2link/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/cite2link"]

# Ship only what is needed to build and install the package; keep the sdist
# lean. README.md and LICENSE are pulled in automatically from project metadata.
[tool.hatch.build.targets.sdist]
include = [
    "/src/cite2link",
    "/pyproject.toml",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
branch = true
source = ["cite2link"]
# The GC talk finder is unfinished and opt-in; exclude it from the floor.
omit = ["*/cite2link/gc.py"]

[tool.coverage.report]
exclude_also = [
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
# ruff-format handles wrapping where it can; the book-definition strings and
# regexes are deliberately laid out by hand, so line-length is not enforced.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Tests import the module under test with `*` on purpose, to exercise the
# public surface the way a REPL user would.
"tests/*" = ["F403", "F405"]
